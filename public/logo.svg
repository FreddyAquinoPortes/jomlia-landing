<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Outer circle border -->
  <circle cx="100" cy="100" r="96" fill="white" stroke="#1a1a2e" stroke-width="4"/>

  <!-- Blue diamond accents at top -->
  <polygon points="100,6 110,16 100,26 90,16" fill="#003087"/>
  <polygon points="116,9 124,17 116,25 108,17" fill="#003087"/>
  <polygon points="84,9 92,17 84,25 76,17" fill="#003087"/>

  <!-- Gear icon in center -->
  <g transform="translate(100,105)" fill="#2a2a2a">
    <!-- Gear body -->
    <circle cx="0" cy="0" r="18" fill="#2a2a2a"/>
    <circle cx="0" cy="0" r="8" fill="white"/>
    <!-- Gear teeth -->
    <rect x="-4" y="-26" width="8" height="10" rx="2" fill="#2a2a2a"/>
    <rect x="-4" y="16" width="8" height="10" rx="2" fill="#2a2a2a"/>
    <rect x="-26" y="-4" width="10" height="8" rx="2" fill="#2a2a2a"/>
    <rect x="16" y="-4" width="10" height="8" rx="2" fill="#2a2a2a"/>
    <!-- Diagonal teeth -->
    <rect x="10" y="-24" width="8" height="10" rx="2" fill="#2a2a2a" transform="rotate(45 14 -19)"/>
    <rect x="-18" y="-24" width="8" height="10" rx="2" fill="#2a2a2a" transform="rotate(-45 -14 -19)"/>
    <rect x="10" y="14" width="8" height="10" rx="2" fill="#2a2a2a" transform="rotate(-45 14 19)"/>
    <rect x="-18" y="14" width="8" height="10" rx="2" fill="#2a2a2a" transform="rotate(45 -14 19)"/>
  </g>

  <!-- "JOMLIA" text arced at top -->
  <defs>
    <path id="topArc" d="M 22,100 A 78,78 0 0,1 178,100"/>
    <path id="bottomArc" d="M 35,130 A 72,72 0 0,0 165,130"/>
  </defs>
  <text font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="26" fill="#1a1a2e" letter-spacing="4">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">JOMLIA</textPath>
  </text>

  <!-- "SOLUTION SERVICES" text arced at bottom -->
  <text font-family="Arial, sans-serif" font-weight="600" font-size="11" fill="#003087" letter-spacing="1.5">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">SOLUTION SERVICES</textPath>
  </text>

  <!-- Red accent arc at bottom of circle -->
  <path d="M 15,130 A 88,88 0 0,0 185,130" fill="none" stroke="#CC0000" stroke-width="5"/>
</svg>
